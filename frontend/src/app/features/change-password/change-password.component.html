<div class="space-y-6">
    <app-breadcrumb></app-breadcrumb>
    <div>
        <h1 class="text-2xl font-bold text-[#163758]">
            Change Password
        </h1>
        <p class="mt-1 text-sm text-gray-500">
            Keep your account secure by updating your password.
        </p>
    </div>
    <div class="mx-auto w-full max-w-2xl rounded-2xl border border-gray-200 bg-white p-5 shadow-sm sm:p-7">
        <div class="mb-6 flex items-start gap-3 rounded-xl border border-blue-100 bg-blue-50 p-4">
            <i-lucide name="shield-check" class="mt-0.5 h-6 w-6 flex-shrink-0 text-[#163758]"> </i-lucide>
            <div>
                <h2 class="text-sm font-semibold text-[#163758]">
                    Password security
                </h2>
                <p class="mt-1 text-sm text-gray-600">
                    Choose a new password that you do not use for your other accounts.
                </p>
            </div>
        </div>
        <form #passwordNgForm="ngForm" (ngSubmit)="changePassword()" class="space-y-5">
            <div>
                <label for="currentPassword" class="mb-2 block text-sm font-medium text-[#163758]">
                    Current Password
                </label>

                <div class="relative">
                    <input id="currentPassword" name="currentPassword" [(ngModel)]="passwordForm.currentPassword"
                        [type]="showCurrentPassword ? 'text' : 'password'" required autocomplete="current-password"
                        placeholder="Enter current password" class="w-full rounded-xl border border-gray-300 py-3 pl-4 pr-12 text-sm outline-none transition focus:border-[#163758] focus:ring-2 focus:ring-[#163758]/10" />
                    <button type="button" (click)="showCurrentPassword = !showCurrentPassword" class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-gray-500 hover:text-[#163758]" [attr.aria-label]="showCurrentPassword ? 'Hide current password' : 'Show current password'">
                        <i-lucide [name]="showCurrentPassword ? 'eye-closed' : 'eye'" class="h-5 w-5"></i-lucide>
                    </button>
                </div>
            </div>
            <div>
                <label for="newPassword" class="mb-2 block text-sm font-medium text-[#163758]">
                    New Password
                </label>
                <div class="relative">
                    <input id="newPassword" name="newPassword" [(ngModel)]="passwordForm.newPassword"
                        [type]="showNewPassword ? 'text' : 'password'" required autocomplete="new-password"
                        placeholder="Enter new password" class="w-full rounded-xl border border-gray-300 py-3 pl-4 pr-12 text-sm outline-none transition focus:border-[#163758] focus:ring-2 focus:ring-[#163758]/10" />
                    <button type="button" (click)="showNewPassword = !showNewPassword" class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-gray-500 hover:text-[#163758]" [attr.aria-label]="showNewPassword ? 'Hide new password' : 'Show new password'">
                        <i-lucide [name]="showNewPassword ? 'eye-closed' : 'eye'" class="h-5 w-5"> </i-lucide>
                    </button>
                </div>
            </div>
            <div>
                <label for="confirmPassword" class="mb-2 block text-sm font-medium text-[#163758]">
                    Confirm New Password
                </label>
                <div class="relative">
                    <input id="confirmPassword" name="confirmPassword" [(ngModel)]="passwordForm.confirmPassword"
                        [type]="showConfirmPassword ? 'text' : 'password'" required autocomplete="new-password"
                        placeholder="Confirm new password" class="w-full rounded-xl border border-gray-300 py-3 pl-4 pr-12 text-sm outline-none transition focus:border-[#163758] focus:ring-2 focus:ring-[#163758]/10" />
                    <button type="button" (click)="showConfirmPassword = !showConfirmPassword" class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-gray-500 hover:text-[#163758]" [attr.aria-label]="showConfirmPassword ? 'Hide confirm password' : 'Show confirm password'">
                        <i-lucide [name]="showConfirmPassword ? 'eye-closed' : 'eye'" class="h-5 w-5"></i-lucide>
                    </button>
                </div>
                <p *ngIf="passwordForm.confirmPassword && passwordForm.newPassword !== passwordForm.confirmPassword" class="mt-2 text-xs text-[#DC1D47]">
                    Passwords do not match.
                </p>
            </div>
            <div class="border-t border-gray-100 pt-5">
                <button type="submit" [disabled]="loadingPassword || !passwordNgForm.valid" class="flex w-full items-center justify-center gap-2 rounded-xl bg-[#DC1D47] px-5 py-3 text-sm font-semibold text-white transition hover:bg-[#bd173b] disabled:cursor-not-allowed disabled:opacity-60 sm:ml-auto sm:w-auto">
                    <i-lucide *ngIf="loadingPassword" name="loader-circle" class="h-4 w-4 animate-spin"></i-lucide>
                    {{ loadingPassword ? 'Updating...' : 'Update Password' }}
                </button>
            </div>
        </form>
    </div>
</div>
