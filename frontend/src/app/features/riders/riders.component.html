<div class="min-h-full p-4 md:p-0">
    <div class="mb-3">
        <app-breadcrumb></app-breadcrumb>
    </div>
    <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div>
            <h1 class="text-xl font-bold text-[#163758]">
                Riders
            </h1>
            <p class="mt-1 text-sm text-gray-500">
                Manage all riders
            </p>
        </div>
        <div class="flex items-center gap-3">
            <button type="button" (click)="toggleFilters()"
                class="relative inline-flex items-center justify-center gap-2 rounded-lg bg-[#163758] px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-[#122e49] focus:outline-none focus:ring-2 focus:ring-[#163758]/50 focus:ring-offset-2">
                <i-lucide name="funnel-plus" [size]="18"></i-lucide>
                <span>Filters</span>
                <span *ngIf="activeFilterCount > 0"
                    class="absolute -top-2 -right-2 flex h-5 min-w-[20px] items-center justify-center rounded-full bg-[#DC1D47] px-1 text-[11px] font-bold text-white shadow">
                    {{ activeFilterCount }}
                </span>
            </button>
            <button type="button" (click)="openCreateDrawer()"
                class="inline-flex items-center justify-center gap-2 rounded-lg bg-[#DC1D47] px-5 py-2.5 text-sm font-semibold text-white transition-all duration-200 hover:bg-[#c7193f] focus:outline-none focus:ring-2 focus:ring-[#DC1D47]/50 focus:ring-offset-2 sm:w-auto">
                <i-lucide name="circle-plus" [size]="18" [strokeWidth]="2"></i-lucide>
                <span>Create Rider</span>
            </button>
        </div>
    </div>
    <form [formGroup]="filterForm" *ngIf="showFilters">
        <div class="mb-6 rounded-xl bg-white p-5 shadow-sm">
            <div class="mb-4 flex items-center justify-between">
                <h2 class="text-base font-semibold text-[#163758]">
                    Filters
                </h2>
                <button type="button" (click)="resetFilters()"
                    class="text-sm font-medium text-[#DC1D47] hover:underline">
                    Reset
                </button>
            </div>
            <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4">
                <div>
                    <label class="mb-1.5 block text-sm font-medium text-gray-700">
                        Search
                    </label>
                    <input type="text" formControlName="search" placeholder="Name, email or mobile"
                        class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm outline-none focus:border-[#163758] focus:ring-1 focus:ring-[#163758]" />
                </div>
                <div>
                    <label class="mb-1.5 block text-sm font-medium text-gray-700">
                        Status
                    </label>
                    <select formControlName="status"
                        class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm outline-none focus:border-[#163758] focus:ring-1 focus:ring-[#163758]">
                        <option value="">
                            All Status
                        </option>
                        <option value="active">
                            Active
                        </option>
                        <option value="inactive">
                            Inactive
                        </option>
                    </select>
                </div>
                <div>
                    <label class="mb-1.5 block text-sm font-medium text-gray-700">
                        Availability
                    </label>
                    <select formControlName="availability"
                        class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm outline-none focus:border-[#163758] focus:ring-1 focus:ring-[#163758]">
                        <option value="">
                            All Availability
                        </option>
                        <option value="available">
                            Available
                        </option>
                        <option value="unavailable">
                            Unavailable
                        </option>
                        <option value="busy">
                            Busy
                        </option>
                    </select>
                </div>
                <div>
                    <label class="mb-1.5 block text-sm font-medium text-gray-700">
                        Sort By
                    </label>
                    <select formControlName="sortBy"
                        class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm outline-none focus:border-[#163758] focus:ring-1 focus:ring-[#163758]">
                        <option value="created_at">
                            Created Date
                        </option>
                        <option value="name">
                            Name
                        </option>
                        <option value="email">
                            Email
                        </option>
                        <option value="mobile">
                            Mobile
                        </option>
                        <option value="status">
                            Status
                        </option>
                        <option value="availability">
                            Availability
                        </option>
                    </select>
                </div>
                <div>
                    <label class="mb-1.5 block text-sm font-medium text-gray-700">
                        Sort Order
                    </label>
                    <select formControlName="sortOrder"
                        class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm outline-none focus:border-[#163758] focus:ring-1 focus:ring-[#163758]">
                        <option value="asc">
                            Ascending
                        </option>
                        <option value="desc">
                            Descending
                        </option>
                    </select>
                </div>
            </div>
        </div>
    </form>
    <div class="overflow-hidden rounded-xl bg-white shadow-sm">
        <div class="overflow-x-auto">
            <table class="min-w-[1200px] w-full">
                <thead class="bg-[#163758]">
                    <tr>
                        <th class="px-5 py-4 text-left text-xs font-semibold uppercase tracking-wide text-white">
                            Rider ID
                        </th>
                        <th class="px-5 py-4 text-left text-xs font-semibold uppercase tracking-wide text-white">
                            Name
                        </th>
                        <th class="px-5 py-4 text-left text-xs font-semibold uppercase tracking-wide text-white">
                            Email
                        </th>
                        <th class="px-5 py-4 text-left text-xs font-semibold uppercase tracking-wide text-white">
                            Mobile
                        </th>
                        <th class="px-5 py-4 text-left text-xs font-semibold uppercase tracking-wide text-white">
                            Vehicle Type
                        </th>
                        <th class="px-5 py-4 text-left text-xs font-semibold uppercase tracking-wide text-white">
                            Status
                        </th>
                        <th class="px-5 py-4 text-left text-xs font-semibold uppercase tracking-wide text-white">
                            Availability
                        </th>
                        <th class="px-5 py-4 text-center text-xs font-semibold uppercase tracking-wide text-white">
                            Actions
                        </th>
                        <th class="px-5 py-4 text-center text-xs font-semibold uppercase tracking-wide text-white">
                            Status Action
                        </th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    <tr *ngIf="loading">
                        <td colspan="10" class="px-5 py-10 text-center text-sm text-gray-500">
                            Loading riders...
                        </td>
                    </tr>
                    <ng-container *ngIf="!loading">
                        <tr *ngFor="let rider of riders" class="transition hover:bg-gray-50">
                            <td class="px-5 py-4 text-sm font-mono text-gray-600">
                                {{ rider.id }}
                            </td>
                            <td class="px-5 py-4 text-sm font-medium text-gray-800">
                                {{ rider.name }}
                            </td>
                            <td class="px-5 py-4 text-sm text-gray-600">
                                {{ rider.email }}
                            </td>
                            <td class="px-5 py-4 text-sm text-gray-600">
                                {{ rider.mobile }}
                            </td>
                            <td *ngIf="rider.vehicle_type" class="px-5 py-4">
                                <div
                                    class="flex h-9 w-9 items-center justify-center rounded-lg border border-gray-200 bg-gray-50 text-[#163758] transition-colors duration-200 hover:border-[#163758] hover:bg-blue-50">
                                    <i-lucide *ngIf="rider.vehicle_type === 'bike'" name="bike"
                                        class="h-5 w-5"></i-lucide>
                                    <i-lucide *ngIf="rider.vehicle_type === 'car'" name="car"
                                        class="h-5 w-5"></i-lucide>
                                    <i-lucide *ngIf="rider.vehicle_type === 'van'" name="van"
                                        class="h-5 w-5"></i-lucide>
                                    <i-lucide *ngIf="rider.vehicle_type === 'scooter'" name="scooter"
                                        class="h-5 w-5"></i-lucide>
                                </div>
                            </td>
                            <td *ngIf="!rider.vehicle_type" class="px-5 py-4">
                                <div
                                    class="flex h-9 w-9 items-center justify-center rounded-lg border border-gray-200 bg-gray-50 text-gray-400 transition-colors duration-200 hover:border-[#163758] hover:bg-blue-50 hover:text-[#163758]">
                                    <i-lucide name="ban" class="h-5 w-5"></i-lucide>
                                </div>
                            </td>
                            <td class="px-5 py-4">
                                <span *ngIf="rider.status === 'active'"
                                    class="rounded-full bg-green-100 px-3 py-1 text-xs font-semibold text-green-700">
                                    Active
                                </span>
                                <span *ngIf="rider.status === 'inactive'"
                                    class="rounded-full bg-red-100 px-3 py-1 text-xs font-semibold text-red-700">
                                    Inactive
                                </span>
                            </td>
                            <td class="px-5 py-4">
                                <span *ngIf="rider.availability === 'available'"
                                    class="rounded-full bg-blue-100 px-3 py-1 text-xs font-semibold text-blue-700">
                                    Available
                                </span>
                                <span *ngIf="rider.availability !== 'available'"
                                    class="rounded-full bg-gray-100 px-3 py-1 text-xs font-semibold text-gray-600">
                                    {{ rider.availability }}
                                </span>
                            </td>
                            <td class="px-5 py-4 text-center">
                                <div class="relative inline-block text-left">
                                    <!-- Three-dot button -->
                                    <button type="button"
                                        (click)=" $event.stopPropagation(); toggleActionMenu(rider.id)"
                                        [attr.aria-expanded]="openActionMenuId === rider.id" aria-label="Rider actions"
                                        class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-100 hover:text-[#163758]">
                                        <i-lucide name="ellipsis-vertical" [size]="22"></i-lucide>
                                    </button>
                                    <!-- Dropdown menu -->
                                    <div *ngIf="openActionMenuId === rider.id"
                                        class="absolute right-0 top-full z-50 mt-2 w-40 rounded-lg border border-gray-200 bg-white py-1 text-left shadow-lg">
                                        <button type="button" (click)="onViewRider(rider)"
                                            class="block w-full px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50">
                                            View
                                        </button>
                                        <button type="button" (click)="onEditRider(rider)"
                                            class="block w-full px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50">
                                            Edit
                                        </button>
                                        <button type="button" (click)="openDeleteConfirmation(rider)"
                                            class="block w-full px-4 py-2.5 text-sm text-red-600 hover:bg-red-50">
                                            Delete
                                        </button>
                                    </div>
                                </div>
                            </td>
                            <td class="px-5 py-4 text-center">
                                <button type="button" (click)="toggleStatus(rider)" [ngClass]="
                                    rider.status === 'active'
                                        ? 'border-red-200 text-red-600 hover:bg-red-50'
                                        : 'border-green-200 text-green-600 hover:bg-green-50'
                                " class="rounded-lg border px-3 py-1.5 text-xs font-medium transition">
                                    {{ rider.status === 'active' ? 'Deactivate' : 'Activate' }}
                                </button>
                            </td>
                        </tr>
                        <tr *ngIf="riders.length === 0">
                            <td colspan="10" class="px-5 py-12 text-center text-sm text-gray-500">
                                No riders found
                            </td>
                        </tr>
                    </ng-container>
                </tbody>
            </table>
        </div>
        <app-pagination *ngIf="!loading && totalPages > 0" [currentPage]="currentPage" [totalPages]="totalPages"
            [pageSize]="pageSize" [loading]="loading" [pageSizeOptions]="[5, 10, 20, 50, 100]"
            (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
        </app-pagination>
    </div>
</div>
<!-- Rider Drawer -->
<div *ngIf="drawerOpen" class="fixed inset-0 z-[100] bg-black/40" (click)="closeDrawer()">
    <aside
        class="absolute right-0 top-0 flex h-full w-full flex-col overflow-hidden bg-white shadow-2xl sm:w-[85%] md:w-[600px] lg:w-[680px]"
        (click)="$event.stopPropagation()">
        <app-rider-form class="flex h-full min-h-0 flex-col" [mode]="drawerMode" [riderId]="selectedRiderId"
            (close)="closeDrawer()" (saved)="getPaginatedRiders()">
        </app-rider-form>
    </aside>
</div>

<app-confirmation-dialog
  [visible]="showDeleteConfirmation"
  [title]="'Delete Rider?'"
  [message]="'Are you sure you want to delete'"
  [itemName]="selectedRiderToDelete?.name || ''"
  [confirmText]="'Confirm Delete'"
  [cancelText]="'Cancel'"
  [loading]="deletingRider"
  [loadingText]="'Deleting...'"
  (confirmed)="confirmDeleteRider()"
  (cancelled)="cancelDelete()">
</app-confirmation-dialog>
