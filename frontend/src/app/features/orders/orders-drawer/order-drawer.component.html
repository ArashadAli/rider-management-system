<div class="fixed inset-0 z-50 flex justify-end bg-slate-900/50" (click)="closeDrawer()">
    <aside class="flex h-full w-full max-w-xl flex-col bg-white shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="drawer-title" (click)="$event.stopPropagation()">
        <div class="flex shrink-0 items-center justify-between border-b border-gray-200 px-6 py-5">
            <div>
                <h2 id="drawer-title" class="text-xl font-bold text-[#163758]">
                    Create Order
                </h2>
                <p class="mt-1 text-sm text-gray-500">
                    Enter the order and delivery details.
                </p>
            </div>
            <button type="button" aria-label="Close drawer" [disabled]="submitting" (click)="closeDrawer()" class="rounded-lg p-2 text-gray-500 hover:bg-gray-100 disabled:opacity-50">
                <span class="text-2xl">&times;</span>
            </button>
        </div>
        <form class="flex min-h-0 flex-1 flex-col" (ngSubmit)="createOrder()">
            <div class="relative min-h-0 flex-1 overflow-hidden">
                <div class="h-full space-y-5 overflow-y-auto p-6" [class.pointer-events-none]="submitting" [attr.aria-busy]="submitting">
                    <div>
                        <h3 class="mb-4 text-sm font-semibold text-[#163758]">
                            Order Details
                        </h3>
                        <div class="space-y-4">
                            <div>
                                <label class="mb-1.5 block text-sm font-medium text-gray-700">
                                    Order Item *
                                </label>
                                <input type="text" name="order_item" [(ngModel)]="newOrder.order_item" required class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm outline-none focus:border-[#DC1D47] focus:ring-2 focus:ring-red-100" placeholder="Enter item name" />
                            </div>
                            <div>
                                <label class="mb-1.5 block text-sm font-medium text-gray-700">
                                    Amount *
                                </label>
                                <input type="number" name="amount" [(ngModel)]="newOrder.amount" min="0.01" step="0.01" required class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm outline-none focus:border-[#DC1D47] focus:ring-2 focus:ring-red-100" placeholder="Enter amount" />
                            </div>
                        </div>
                    </div>
                    <div class="border-t border-gray-100 pt-5">
                        <h3 class="mb-4 text-sm font-semibold text-[#163758]">
                            Customer Details
                        </h3>
                        <div class="space-y-4">
                            <div>
                                <label class="mb-1.5 block text-sm font-medium text-gray-700">
                                    Customer Name *
                                </label>
                                <input type="text" name="customer_name" [(ngModel)]="newOrder.customer_name" required class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm outline-none focus:border-[#DC1D47] focus:ring-2 focus:ring-red-100" placeholder="Enter customer name" />
                            </div>
                            <div>
                                <label class="mb-1.5 block text-sm font-medium text-gray-700">
                                    Mobile Number *
                                </label>
                                <input type="tel" name="customer_mobile" [(ngModel)]="newOrder.customer_mobile" maxlength="10" required class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm outline-none focus:border-[#DC1D47] focus:ring-2 focus:ring-red-100" placeholder="10-digit mobile number" />
                            </div>
                        </div>
                    </div>
                    <div class="border-t border-gray-100 pt-5">
                        <h3 class="mb-4 text-sm font-semibold text-[#163758]">
                            Delivery Details
                        </h3>
                        <div class="space-y-4">
                            <div>
                                <label class="mb-1.5 block text-sm font-medium text-gray-700">
                                    Pickup Address *
                                </label>
                                <textarea name="pickup_address" [(ngModel)]="newOrder.pickup_address" rows="3" required class="w-full resize-y rounded-lg border border-gray-300 px-3 py-2.5 text-sm outline-none focus:border-[#DC1D47] focus:ring-2 focus:ring-red-100" placeholder="Enter pickup address"></textarea>
                            </div>
                            <div>
                                <label class="mb-1.5 block text-sm font-medium text-gray-700">
                                    Delivery Address *
                                </label>
                                <textarea name="delivery_address" [(ngModel)]="newOrder.delivery_address" rows="3" required class="w-full resize-y rounded-lg border border-gray-300 px-3 py-2.5 text-sm outline-none focus:border-[#DC1D47] focus:ring-2 focus:ring-red-100" placeholder="Enter delivery address"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
                <div *ngIf="submitting" class="absolute inset-0 z-20 flex items-center justify-center bg-white/85 backdrop-blur-[1px]" role="status" aria-live="polite">
                    <div class="flex flex-col items-center gap-3">
                        <div class="h-10 w-10 animate-spin rounded-full border-4 border-gray-200 border-t-[#DC1D47]"></div>
                        <p class="text-sm font-medium text-[#163758]">
                            Creating order...
                        </p>
                        <p class="text-xs text-gray-500">
                            Please wait while we save your order.
                        </p>
                    </div>
                </div>
            </div>
            <div class="flex shrink-0 justify-end gap-3 border-t border-gray-200 bg-white px-6 py-4">
                <button type="button" [disabled]="submitting" (click)="closeDrawer()" class="rounded-lg border border-gray-30 px-4 py-2.5 text-sm font-semibold text-gray-700 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50">
                    Cancel
                </button>
                <button type="submit" [disabled]="submitting" class="rounded-lg bg-[#DC1D47] px-5 py-2.5 text-sm font-semibold text-white hover:bg-[#c9183f] disabled:cursor-not-allowed disabled:opacity-50">
                    {{ submitting ? 'Creating...' : 'Create Order' }}
                </button>
            </div>
        </form>
    </aside>
</div>
