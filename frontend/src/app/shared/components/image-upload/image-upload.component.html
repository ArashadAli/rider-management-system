<div class="flex flex-col items-center gap-4 rounded-xl border border-dashed border-gray-300 p-5 sm:flex-row">
    <div class="relative flex h-24 w-24 shrink-0 items-center justify-center overflow-hidden rounded-full bg-gray-100">
        <img *ngIf="displayImage" [src]="displayImage" alt="Image Preview" class="h-full w-full object-cover" />
        <span *ngIf="!displayImage" class="text-2xl font-bold text-gray-400">
            ?
        </span>
        <button *ngIf="imagePreview && !disabled" type="button" (click)="removeImage()"
            class="absolute right-0 top-0 flex h-6 w-6 items-center justify-center rounded-full bg-red-500 text-white shadow hover:bg-red-600"
            aria-label="Remove selected image">
            <i-lucide name="x" [size]="14"></i-lucide>
        </button>
    </div>
    <div *ngIf="!disabled" class="w-full">
        <input type="file" [accept]="accept" (change)="onFileSelected($event)" class="block w-full text-sm text-gray-500
            file:mr-4 file:rounded-lg file:border-0
            file:bg-[#163758] file:px-4 file:py-2
            file:text-sm file:font-medium file:text-white
            hover:file:bg-[#102b45]" />
        <p class="mt-2 text-xs text-gray-400">
            JPG or PNG. Maximum size: {{ maxSizeMB }} MB.
        </p>
        <p *ngIf="errorMessage" class="mt-2 text-xs text-red-500">
            {{ errorMessage }}
        </p>
    </div>
</div>
