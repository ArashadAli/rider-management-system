<aside
  class="fixed top-[70px] bottom-0 left-0 z-40 w-[240px] bg-[#163758] px-3.5 py-6 flex flex-col justify-between transition-transform duration-300 -translate-x-full md:translate-x-0"
  [class.translate-x-0]="sidebarOpen">
  <nav class="flex flex-col gap-1.5">
    <a routerLink="/dashboard" routerLinkActive="bg-[#DC1D47] text-white font-semibold"
      [routerLinkActiveOptions]="{ exact: true }" (click)="closeOnMobile()"
      class="flex items-center gap-3 rounded-lg px-3.5 py-3 text-sm font-medium text-[#dbe5ee] transition hover:bg-[#DC1D47] hover:text-white">
      <i-lucide name="layout-dashboard" class="w-[22px] text-center text-lg" [size]="18"></i-lucide>
      <span>Dashboard</span>
    </a>
    <a routerLink="/orders" routerLinkActive="bg-[#DC1D47] text-white font-semibold" (click)="closeOnMobile()"
      class="flex items-center gap-3 rounded-lg px-3.5 py-3 text-sm font-medium text-[#dbe5ee] transition hover:bg-[#DC1D47] hover:text-white">
      <i-lucide name="shopping-cart-icon" class="w-[22px] text-center text-lg" [size]="18"></i-lucide>
      <span>Orders</span>
    </a>
    <a routerLink="/riders" routerLinkActive="bg-[#DC1D47] text-white font-semibold" (click)="closeOnMobile()"
      class="flex items-center gap-3 rounded-lg px-3.5 py-3 text-sm font-medium text-[#dbe5ee] transition hover:bg-[#DC1D47] hover:text-white">
      <i-lucide name="truck" class="w-[22px] text-center text-lg" [size]="18"></i-lucide>
      <span>Riders</span>
    </a>
    <a routerLink="/profile" routerLinkActive="bg-[#DC1D47] text-white font-semibold" (click)="closeOnMobile()"
      class="flex items-center gap-3 rounded-lg px-3.5 py-3 text-sm font-medium text-[#dbe5ee] transition hover:bg-[#DC1D47] hover:text-white">
      <i-lucide name="user-round-cog" class="w-[22px] text-center text-lg" [size]="18"></i-lucide>
      <span>Profile</span>
    </a>
  </nav>
  <div class="border-t border-white/15 pt-5">
    <button (click)="logoutUser()" type="button"
      class="flex w-full items-center justify-center gap-2 rounded-lg border border-white/25 px-3.5 py-2.5 text-sm font-medium text-white transition-all duration-200 hover:border-[#DC1D47] hover:bg-[#DC1D47] focus:outline-none focus:ring-2 focus:ring-[#DC1D47]/50">
      <i-lucide name="log-out" [size]="18" [strokeWidth]="2">
      </i-lucide>
      <span>Logout</span>
    </button>
  </div>

</aside>


<div *ngIf="sidebarOpen" class="fixed inset-0 top-[70px] z-30 bg-black/35 md:hidden" (click)="closeSidebar.emit()">
</div>
